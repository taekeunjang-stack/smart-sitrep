<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>출타/진료 신청 결재 시연 시스템 (Galaxy Style)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #1b4998;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
    body { background-color: #020617; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }

    /* 갤럭시 스타일 프레임 */
    .galaxy-device {
      width: 100%;
      max-width: 412px;
      height: 880px;
      max-height: 96vh;
      background-color: var(--bg);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      border: 4px solid #1e293b;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .galaxy-punchhole {
      width: 12px; height: 12px; background-color: #000; border-radius: 50%;
      position: absolute; top: 6px; left: 50%; transform: translateX(-50%); z-index: 100;
    }
    .status-bar { height: 28px; background: white; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; font-size: 11px; font-weight: 600; color: #334155; }

    .role-switcher { background: #0f172a; color: white; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .role-switcher select { background: #1e293b; color: white; border: 1px solid #334155; padding: 4px 8px; border-radius: 4px; font-weight: bold; }

    .app-header { background: white; padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .app-header h2 { font-size: 15px; color: var(--text); }

    .content-area { flex: 1; overflow-y: auto; padding: 12px; padding-bottom: 70px; }
    
    .notification-banner {
      background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: 10px 12px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between; cursor: pointer; animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.85; } }

    .filter-tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn { padding: 6px 12px; font-size: 12px; border-radius: 4px; border: 1px solid var(--border); background: white; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: bold; }

    .req-card { background: white; border-radius: 6px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); cursor: pointer; }
    .req-card:active { background-color: #f1f5f9; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .badge { padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
    .badge-review { background: #fef3c7; color: #92400e; }
    .badge-approval { background: #dbeafe; color: #1e40af; }
    .badge-success { background: #d1fae5; color: #065f46; }
    .badge-reject { background: #fee2e2; color: #991b1b; }

    /* 모바일 레이어 팝업 공통 스타일 */
    .layer-overlay {
      position: absolute; inset: 0; background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(2px); display: none; justify-content: center; align-items: center; z-index: 200; padding: 16px;
    }
    .layer-overlay.active { display: flex; }
    .layer-popup {
      background: white; width: 100%; max-width: 360px; border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3); overflow: hidden; animation: popIn 0.2s ease-out;
    }
    @keyframes popIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .popup-header { background: #f8fafc; padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .popup-body { padding: 16px; max-height: 480px; overflow-y: auto; }
    
    .info-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 12px; }
    .info-table th, .info-table td { border: 1px solid var(--border); padding: 8px; text-align: left; }
    .info-table th { background: #f1f5f9; color: #475569; width: 32%; }

    .popup-footer { padding: 12px 16px; background: #f8fafc; border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .btn { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 12px; }
    .btn-cancel { background: #f1f5f9; color: #475569; border: 1px solid var(--border); }
    .btn-reject { background: #fee2e2; color: var(--danger); border: 1px solid #fca5a5; }
    .btn-approve { background: var(--primary); color: white; }

    .bottom-nav { position: absolute; bottom: 0; width: 100%; height: 56px; background: white; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #64748b; cursor: pointer; }
    .nav-item.active { color: var(--primary); font-weight: bold; }
    .nav-item i { font-size: 15px; margin-bottom: 2px; }
  </style>
</head>
<body>

<div class="galaxy-device">
  <div class="galaxy-punchhole"></div>
  <div class="status-bar">
    <span>10:24</span>
    <div><i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-signal"></i> <i class="fa-solid fa-battery-three-quarters"></i></div>
  </div>

  <div class="role-switcher">
    <span><i class="fa-solid fa-user-gear"></i> 시연 권한:</span>
    <select id="roleSelect" onchange="changeRole()">
      <option value="ADMIN">행정보급관 (검토자)</option>
      <option value="COMMANDER">중대장 (최종 결재권자)</option>
      <option value="USER">신청자 (용사 - 반려 확인용)</option>
    </select>
  </div>

  <div class="app-header">
    <h2 id="headerTitle"><i class="fa-solid fa-clipboard-check"></i> 출타/진료 신청 검토</h2>
  </div>

  <div class="content-area">
    <div class="notification-banner" id="notifBanner" onclick="handleNotificationClick()">
      <div>
        <div style="font-size: 11px; font-weight: bold; color: #1e40af;"><i class="fa-solid fa-bell"></i> 신규 출타 신청 알림</div>
        <div style="font-size: 12px; color: #1e293b;" id="notifText">신규 출타 신청이 접수되었습니다.</div>
      </div>
      <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #93c5fd;"></i>
    </div>

    <div class="filter-tabs">
      <button class="tab-btn active" onclick="filterList('ALL')">전체</button>
      <button class="tab-btn" onclick="filterList('REVIEW')">검토대기</button>
      <button class="tab-btn" onclick="filterList('APPROVAL')">결재대기</button>
      <button class="tab-btn" onclick="filterList('SUCCESS')">최종승인</button>
      <button class="tab-btn" onclick="filterList('REJECT')">반려</button>
    </div>

    <div id="requestList"></div>
  </div>

  <!-- 1차 상세 레이어 팝업 -->
  <div class="layer-overlay" id="layerOverlay">
    <div class="layer-popup">
      <div class="popup-header">
        <h3 style="font-size: 14px; font-weight: bold; color: var(--text);" id="modalTitle">출타 신청 상세 정보</h3>
        <i class="fa-solid fa-xmark" onclick="closePopup()" style="cursor:pointer; font-size: 16px; color: #64748b;"></i>
      </div>
      
      <div class="popup-body">
        <table class="info-table">
          <tr><th>신청 유형</th><td id="mType">휴가</td></tr>
          <tr><th>신청자</th><td id="mUser">일등병 홍길동</td></tr>
          <tr><th>군번</th><td id="mCode">25-912301</td></tr>
          <tr><th>세부 일정</th><td id="mDate">2026.10.29 ~ 2026.10.31</td></tr>
          <tr><th>행선지</th><td id="mDestination">부산광역시 남구</td></tr>
          <tr><th>신청 사유</th><td id="mReason">포상휴가 신청</td></tr>
          <tr><th>현재 상태</th><td id="mStatus">검토대기</td></tr>
          <tr id="rejectReasonRow" style="display:none; background:#fef2f2;">
            <th style="color:var(--danger);">반려 사유</th>
            <td id="mRejectReason" style="color:var(--danger); font-weight:bold;"></td>
          </tr>
        </table>
      </div>

      <div class="popup-footer" id="actionBtnGroup">
        <button class="btn btn-reject" onclick="openRejectPopup()">반려 처리</button>
        <button class="btn btn-approve" id="approveBtnText" onclick="processAction('APPROVE')">상신 처리</button>
      </div>
    </div>
  </div>

  <!-- 2차 반려 사유 입력 레이어 팝업 -->
  <div class="layer-overlay" id="rejectOverlay" style="z-index: 300;">
    <div class="layer-popup">
      <div class="popup-header">
        <h3 style="font-size: 14px; font-weight: bold; color: var(--danger);"><i class="fa-solid fa-triangle-exclamation"></i> 반려 사유 입력</h3>
        <i class="fa-solid fa-xmark" onclick="closeRejectPopup()" style="cursor:pointer; font-size: 16px; color: #64748b;"></i>
      </div>
      
      <div class="popup-body">
        <p style="font-size: 12px; color: #475569; margin-bottom: 8px;">신청자(용사)에게 전달될 반려 사유를 입력하세요.</p>
        <textarea id="rejectInput" rows="4" style="width:100%; border:1px solid var(--border); border-radius:4px; padding:8px; font-size:12px; resize:none;" placeholder="예: 부대 훈련 일정과 중복되어 반려 처리함"></textarea>
      </div>

      <div class="popup-footer">
        <button class="btn btn-cancel" onclick="closeRejectPopup()">취소</button>
        <button class="btn btn-reject" onclick="confirmReject()">반려 확정</button>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item"><i class="fa-solid fa-house"></i>Home</div>
    <div class="nav-item active"><i class="fa-solid fa-file-signature"></i>출타결재</div>
    <div class="nav-item"><i class="fa-solid fa-hospital"></i>진료확인</div>
    <div class="nav-item"><i class="fa-solid fa-user"></i>마이페이지</div>
  </div>
</div>

<script>
  let requests = [
    { id: 82, type: '외출', user: '일등병 홍길동', code: '25-912301', date: '2026.06.06 (09:00~18:00)', dest: '부산광역시 남구', reason: '포상외출', status: 'REVIEW', rejectReason: '' },
    { id: 81, type: '휴가', user: '상등병 임꺽정', code: '25-710239', date: '2026.07.01 ~ 2026.07.05', dest: '서울특별시 마포구', reason: '정기휴가', status: 'APPROVAL', rejectReason: '' },
    { id: 80, type: '외박', user: '병장 이순신', code: '24-110293', date: '2026.06.12 ~ 2026.06.13', dest: '강원도 춘천시', reason: '성과제 외박', status: 'SUCCESS', rejectReason: '' },
    { id: 79, type: '진료', user: '일등병 이몽룡', code: '25-992101', date: '2026.06.08', dest: '수도병원 내과', reason: '감기 몸살 진료', status: 'REJECT', rejectReason: '부대 훈련 일정과 중복' }
  ];

  let currentRole = 'ADMIN';
  let currentFilter = 'ALL';
  let selectedReqId = null;

  function changeRole() {
    currentRole = document.getElementById('roleSelect').value;
    const notifBanner = document.getElementById('notifBanner');
    const headerTitle = document.getElementById('headerTitle');

    if(currentRole === 'ADMIN') {
      headerTitle.innerHTML = `<i class="fa-solid fa-clipboard-check"></i> 출타/진료 신청 검토 (행보관)`;
      document.getElementById('notifText').innerText = `[신규] 용사의 출타 신청 검토 요청 알림이 있습니다.`;
      notifBanner.style.display = 'flex';
    } else if(currentRole === 'COMMANDER') {
      headerTitle.innerHTML = `<i class="fa-solid fa-stamp"></i> 출타/진료 최종 결재 (중대장)`;
      document.getElementById('notifText').innerText = `[상신] 행보관이 상신한 결재 승인 요청이 있습니다.`;
      notifBanner.style.display = 'flex';
    } else {
      headerTitle.innerHTML = `<i class="fa-solid fa-user"></i> 내 출타 신청 현황 (용사)`;
      notifBanner.style.display = 'none';
    }
    renderList();
  }

  function renderList() {
    const listEl = document.getElementById('requestList');
    listEl.innerHTML = '';

    const filtered = requests.filter(r => currentFilter === 'ALL' || r.status === currentFilter);

    if(filtered.length === 0) {
      listEl.innerHTML = `<div style="text-align:center; color:#94a3b8; padding:30px; font-size:12px;">해당 항목이 없습니다.</div>`;
      return;
    }

    filtered.forEach(item => {
      let badgeHtml = '';
      if(item.status === 'REVIEW') badgeHtml = `<span class="badge badge-review">검토대기</span>`;
      else if(item.status === 'APPROVAL') badgeHtml = `<span class="badge badge-approval">결재대기</span>`;
      else if(item.status === 'SUCCESS') badgeHtml = `<span class="badge badge-success">최종승인</span>`;
      else if(item.status === 'REJECT') badgeHtml = `<span class="badge badge-reject">반려</span>`;

      const card = document.createElement('div');
      card.className = 'req-card';
      card.onclick = () => openPopup(item.id);
      card.innerHTML = `
        <div class="card-header">
          <strong style="font-size:13px; color:#0f172a;">(${item.type}) ${item.user}</strong>
          ${badgeHtml}
        </div>
        <div style="font-size:11px; color:#64748b;">일정: ${item.date}</div>
        <div style="font-size:11px; color:#64748b;">사유: ${item.reason}</div>
      `;
      listEl.appendChild(card);
    });
  }

  function filterList(filterType) {
    currentFilter = filterType;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    renderList();
  }

  function openPopup(id) {
    selectedReqId = id;
    const req = requests.find(r => r.id === id);
    if(!req) return;

    document.getElementById('mType').innerText = req.type;
    document.getElementById('mUser').innerText = req.user;
    document.getElementById('mCode').innerText = req.code;
    document.getElementById('mDate').innerText = req.date;
    document.getElementById('mDestination').innerText = req.dest;
    document.getElementById('mReason').innerText = req.reason;

    const actionGroup = document.getElementById('actionBtnGroup');
    const approveBtn = document.getElementById('approveBtnText');
    const rejectRow = document.getElementById('rejectReasonRow');

    let statusTxt = '';
    if(req.status === 'REVIEW') statusTxt = '행정보급관 검토 대기 중';
    if(req.status === 'APPROVAL') statusTxt = '중대장 결재 대기 중';
    if(req.status === 'SUCCESS') statusTxt = '최종 승인 완료';
    if(req.status === 'REJECT') statusTxt = '반려 처리됨';
    document.getElementById('mStatus').innerText = statusTxt;

    if(req.status === 'REJECT') {
      rejectRow.style.display = 'table-row';
      document.getElementById('mRejectReason').innerText = req.rejectReason || '사유 미기재';
    } else {
      rejectRow.style.display = 'none';
    }

    if(currentRole === 'ADMIN' && req.status === 'REVIEW') {
      actionGroup.style.display = 'flex';
      approveBtn.innerText = '검토 후 결재 상신';
    } else if(currentRole === 'COMMANDER' && req.status === 'APPROVAL') {
      actionGroup.style.display = 'flex';
      approveBtn.innerText = '최종 결재 승인';
    } else {
      actionGroup.style.display = 'none';
    }

    document.getElementById('layerOverlay').classList.add('active');
  }

  function closePopup() {
    document.getElementById('layerOverlay').classList.remove('active');
  }

  /* 반려 레이어 팝업 제어 */
  function openRejectPopup() {
    document.getElementById('rejectInput').value = '';
    document.getElementById('rejectOverlay').classList.add('active');
  }

  function closeRejectPopup() {
    document.getElementById('rejectOverlay').classList.remove('active');
  }

  function confirmReject() {
    const reasonText = document.getElementById('rejectInput').value.trim();
    if(!reasonText) {
      alert('반려 사유를 입력해 주세요.');
      return;
    }

    const req = requests.find(r => r.id === selectedReqId);
    if(req) {
      req.status = 'REJECT';
      req.rejectReason = reasonText;
    }

    closeRejectPopup();
    closePopup();
    renderList();
  }

  function processAction(actionType) {
    const req = requests.find(r => r.id === selectedReqId);
    if(!req) return;

    if(actionType === 'APPROVE') {
      if(currentRole === 'ADMIN') {
        req.status = 'APPROVAL';
      } else if(currentRole === 'COMMANDER') {
        req.status = 'SUCCESS';
      }
    }
    closePopup();
    renderList();
  }

  function handleNotificationClick() {
    if(currentRole === 'ADMIN') filterList('REVIEW');
    if(currentRole === 'COMMANDER') filterList('APPROVAL');
  }

  changeRole();
</script>
</body>
</html>
