<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>출타/진료 신청 결재 시연 시스템</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #1b4998;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }

    .device-container {
      width: 100%;
      max-width: 430px;
      height: 900px;
      max-height: 95vh;
      background-color: var(--bg);
      border-radius: 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 8px solid #334155;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* 상단 헤더 및 스위처 */
    .status-bar { height: 24px; background: white; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; font-size: 11px; font-weight: bold; }
    .role-switcher { background: #1e293b; color: white; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .role-switcher select { background: #334155; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-weight: bold; }

    .app-header { background: white; padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .app-header h2 { font-size: 16px; color: var(--text); }

    .content-area { flex: 1; overflow-y: auto; padding: 12px; padding-bottom: 70px; }
    
    /* 알림 바너 */
    .notification-banner {
      background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between; cursor: pointer; animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }

    /* 필터 탭 */
    .filter-tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
    .tab-btn { padding: 6px 12px; font-size: 12px; border-radius: 16px; border: 1px solid var(--border); background: white; cursor: pointer; white-space: nowrap; }
    .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: bold; }

    /* 리스트 카드 */
    .req-card { background: white; border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); cursor: pointer; transition: transform 0.1s; }
    .req-card:active { transform: scale(0.98); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .badge { padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: bold; }
    .badge-review { background: #fef3c7; color: #92400e; } /* 검토대기 */
    .badge-approval { background: #dbeafe; color: #1e40af; } /* 결재대기 */
    .badge-success { background: #d1fae5; color: #065f46; } /* 최종승인 */
    .badge-reject { background: #fee2e2; color: #991b1b; } /* 반려 */

    /* 상세 정보 모달 */
    .modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: flex-end; z-index: 200; }
    .modal-overlay.active { display: flex; }
    .modal-sheet { background: white; width: 100%; border-radius: 20px 20px 0 0; padding: 20px; max-height: 80%; overflow-y: auto; animation: slideUp 0.25s ease-out; }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .info-table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
    .info-table th, .info-table td { border: 1px solid var(--border); padding: 8px; text-align: left; }
    .info-table th { background: #f8fafc; color: #64748b; width: 30%; }

    .btn-group { display: flex; gap: 8px; margin-top: 15px; }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
    .btn-reject { background: #fee2e2; color: var(--danger); }
    .btn-approve { background: var(--primary); color: white; }

    /* 하단 탭 바 */
    .bottom-nav { position: absolute; bottom: 0; width: 100%; height: 60px; background: white; border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #64748b; cursor: pointer; }
    .nav-item.active { color: var(--primary); font-weight: bold; }
    .nav-item i { font-size: 16px; margin-bottom: 2px; }

    @media (min-width: 768px) {
      .device-container { max-width: 768px; height: 90vh; }
    }
  </style>
</head>
<body>

<div class="device-container">
  <div class="status-bar">
    <span>09:30</span>
    <div><i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></div>
  </div>

  <!-- Role Selector (시연용 권한 전환) -->
  <div class="role-switcher">
    <span><i class="fa-solid fa-user-shield"></i> 현재 시연 권한:</span>
    <select id="roleSelect" onchange="changeRole()">
      <option value="ADMIN">행정보급관 (검토자)</option>
      <option value="COMMANDER">중대장 (최종 결재권자)</option>
      <option value="USER">신청자 (용사 - 반려 확인용)</option>
    </select>
  </div>

  <div class="app-header">
    <h2 id="headerTitle"><i class="fa-solid fa-clipboard-check"></i> 출타/진료 신청 검토</h2>
  </div>

  <div class="content-area">
    <!-- 실시간 알림 시뮬레이션 바너 -->
    <div class="notification-banner" id="notifBanner" onclick="handleNotificationClick()">
      <div>
        <div style="font-size: 11px; font-weight: bold; color: #1e40af;"><i class="fa-solid fa-bell"></i> 신규 출타 신청 알림</div>
        <div style="font-size: 12px; color: #1e293b;" id="notifText">신규 출타 신청(일등병 홍길동)이 접수되었습니다.</div>
      </div>
      <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #93c5fd;"></i>
    </div>

    <!-- 필터 버튼 목록 -->
    <div class="filter-tabs">
      <button class="tab-btn active" onclick="filterList('ALL')">전체</button>
      <button class="tab-btn" onclick="filterList('REVIEW')">검토대기</button>
      <button class="tab-btn" onclick="filterList('APPROVAL')">결재대기</button>
      <button class="tab-btn" onclick="filterList('SUCCESS')">최종승인</button>
      <button class="tab-btn" onclick="filterList('REJECT')">반려</button>
    </div>

    <!-- 신청 목록 (JS 렌더링) -->
    <div id="requestList"></div>
  </div>

  <!-- 상세 정보 및 결재/반려 처리 모달 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3 style="font-size: 16px;" id="modalTitle">출타 신청 상세 정보</h3>
        <i class="fa-solid fa-xmark" onclick="closeModal()" style="cursor:pointer;"></i>
      </div>
      
      <table class="info-table">
        <tr><th>신청 유형</th><td id="mType">휴가</td></tr>
        <tr><th>신청자</th><td id="mUser">일등병 홍길동 (25-912301)</td></tr>
        <tr><th>소속</th><td>군수사령부 정보작전처</td></tr>
        <tr><th>세부 일정</th><td id="mDate">2026.10.29 ~ 2026.10.31</td></tr>
        <tr><th>행선지</th><td id="mDestination">부산광역시 남구</td></tr>
        <tr><th>신청 사유</th><td id="mReason">포상휴가 신청</td></tr>
        <tr><th>현재 상태</th><td id="mStatus">검토대기</td></tr>
        <tr id="rejectReasonRow" style="display:none; background:#fef2f2;">
          <th style="color:var(--danger);">반려 사유</th>
          <td id="mRejectReason" style="color:var(--danger);"></td>
        </tr>
      </table>

      <div class="btn-group" id="actionBtnGroup">
        <button class="btn btn-reject" onclick="processAction('REJECT')">반려 처리</button>
        <button class="btn btn-approve" id="approveBtnText" onclick="processAction('APPROVE')">상신 처리</button>
      </div>
    </div>
  </div>

  <!-- 하단 탭 바 -->
  <div class="bottom-nav">
    <div class="nav-item"><i class="fa-solid fa-house"></i>Home</div>
    <div class="nav-item active"><i class="fa-solid fa-file-signature"></i>출타결재</div>
    <div class="nav-item"><i class="fa-solid fa-hospital"></i>진료확인</div>
    <div class="nav-item"><i class="fa-solid fa-user"></i>마이페이지</div>
  </div>
</div>

<script>
  // 샘플 데이터 데이터베이스
  let requests = [
    { id: 82, type: '외출', user: '일등병 홍길동', code: '25-912301', date: '2026.06.06 (09:00~18:00)', dest: '부산광역시 남구', reason: '포상외출', status: 'REVIEW', rejectReason: '' },
    { id: 81, type: '휴가', user: '상등병 임꺽정', code: '25-710239', date: '2026.07.01 ~ 2026.07.05', dest: '서울특별시 마포구', reason: '정기휴가', status: 'APPROVAL', rejectReason: '' },
    { id: 80, type: '외박', user: '병장 이순신', code: '24-110293', date: '2026.06.12 ~ 2026.06.13', dest: '강원도 춘천시', reason: '성과제 외박', status: 'SUCCESS', rejectReason: '' },
    { id: 79, type: '진료', user: '일등병 이몽룡', code: '25-992101', date: '2026.06.08', dest: '수도병원 내과', reason: '감기 몸살 진료', status: 'REJECT', rejectReason: '부대 훈련 일정과 중복' }
  ];

  let currentRole = 'ADMIN'; // ADMIN(행보관), COMMANDER(중대장), USER(용사)
  let currentFilter = 'ALL';
  let selectedReqId = null;

  function changeRole() {
    currentRole = document.getElementById('roleSelect').value;
    const notifBanner = document.getElementById('notifBanner');
    const headerTitle = document.getElementById('headerTitle');

    if(currentRole === 'ADMIN') {
      headerTitle.innerHTML = `<i class="fa-solid fa-clipboard-check"></i> 출타/진료 신청 검토 (행보관)`;
      document.getElementById('notifText').innerText = `[신규] 용사의 출타 신청 검토 요청 알림이 있습니다.`;
      notifBanner.style.display = 'flex';
    } else if(currentRole === 'COMMANDER') {
      headerTitle.innerHTML = `<i class="fa-solid fa-stamp"></i> 출타/진료 최종 결재 (중대장)`;
      document.getElementById('notifText').innerText = `[상신] 행보관이 상신한 결재 승인 요청이 있습니다.`;
      notifBanner.style.display = 'flex';
    } else {
      headerTitle.innerHTML = `<i class="fa-solid fa-user"></i> 내 출타 신청 현황 (용사)`;
      notifBanner.style.display = 'none';
    }
    renderList();
  }

  function renderList() {
    const listEl = document.getElementById('requestList');
    listEl.innerHTML = '';

    const filtered = requests.filter(r => {
      if(currentFilter === 'ALL') return true;
      return r.status === currentFilter;
    });

    if(filtered.length === 0) {
      listEl.innerHTML = `<div style="text-align:center; color:#888; padding:30px;">해당 항목이 없습니다.</div>`;
      return;
    }

    filtered.forEach(item => {
      let badgeHtml = '';
      if(item.status === 'REVIEW') badgeHtml = `<span class="badge badge-review">검토대기</span>`;
      else if(item.status === 'APPROVAL') badgeHtml = `<span class="badge badge-approval">결재대기</span>`;
      else if(item.status === 'SUCCESS') badgeHtml = `<span class="badge badge-success">최종승인</span>`;
      else if(item.status === 'REJECT') badgeHtml = `<span class="badge badge-reject">반려</span>`;

      const card = document.createElement('div');
      card.className = 'req-card';
      card.onclick = () => openModal(item.id);
      card.innerHTML = `
        <div class="card-header">
          <strong style="font-size:14px;">(${item.type}) ${item.user}</strong>
          ${badgeHtml}
        </div>
        <div style="font-size:12px; color:#64748b;">일정: ${item.date}</div>
        <div style="font-size:12px; color:#64748b;">사유: ${item.reason}</div>
      `;
      listEl.appendChild(card);
    });
  }

  function filterList(filterType) {
    currentFilter = filterType;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    renderList();
  }

  function openModal(id) {
    selectedReqId = id;
    const req = requests.find(r => r.id === id);
    if(!req) return;

    document.getElementById('mType').innerText = req.type;
    document.getElementById('mUser').innerText = `${req.user} (${req.code})`;
    document.getElementById('mDate').innerText = req.date;
    document.getElementById('mDestination').innerText = req.dest;
    document.getElementById('mReason').innerText = req.reason;

    const actionGroup = document.getElementById('actionBtnGroup');
    const approveBtn = document.getElementById('approveBtnText');
    const rejectRow = document.getElementById('rejectReasonRow');

    // 상태 표시
    let statusTxt = '';
    if(req.status === 'REVIEW') statusTxt = '행정보급관 검토 대기 중';
    if(req.status === 'APPROVAL') statusTxt = '중대장 결재 대기 중';
    if(req.status === 'SUCCESS') statusTxt = '최종 승인 완료';
    if(req.status === 'REJECT') statusTxt = '반려 처리됨';
    document.getElementById('mStatus').innerText = statusTxt;

    // 반려 사유 노출
    if(req.status === 'REJECT') {
      rejectRow.style.display = 'table-row';
      document.getElementById('mRejectReason').innerText = req.rejectReason || '사유 미기재';
    } else {
      rejectRow.style.display = 'none';
    }

    // 권한별 버튼 액션 및 제어
    if(currentRole === 'ADMIN' && req.status === 'REVIEW') {
      actionGroup.style.display = 'flex';
      approveBtn.innerText = '검토 후 결재 상신';
    } else if(currentRole === 'COMMANDER' && req.status === 'APPROVAL') {
      actionGroup.style.display = 'flex';
      approveBtn.innerText = '최종 결재 승인';
    } else {
      actionGroup.style.display = 'none'; // 처리 권한 없음 또는 이미 완료된 항목
    }

    document.getElementById('modalOverlay').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
  }

  function processAction(actionType) {
    const req = requests.find(r => r.id === selectedReqId);
    if(!req) return;

    if(actionType === 'REJECT') {
      const reason = prompt('반려 사유를 입력하세요:', '부대 사정으로 인한 불가');
      if(reason !== null) {
        req.status = 'REJECT';
        req.rejectReason = reason;
        alert('반려 처리가 완료되었습니다. 신청자(용사)에게 알림이 전파됩니다.');
      }
    } else if(actionType === 'APPROVE') {
      if(currentRole === 'ADMIN') {
        req.status = 'APPROVAL';
        alert('중대장님께 결재 상신이 완료되었습니다.');
      } else if(currentRole === 'COMMANDER') {
        req.status = 'SUCCESS';
        alert('최종 결재 승인이 완료되었습니다.');
      }
    }
    closeModal();
    renderList();
  }

  function handleNotificationClick() {
    if(currentRole === 'ADMIN') filterList('REVIEW');
    if(currentRole === 'COMMANDER') filterList('APPROVAL');
  }

  // 초기화
  changeRole();
</script>
</body>
</html>
